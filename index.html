<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Malvinas Arcade: campaña de tres niveles en el navegador. Hangar en el continente, bombardeo en el estrecho de San Carlos y combate aire-aire.">
<style>html{color-scheme:dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Malvinas Arcade</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  /* Layout: una sola pantalla 16:10 compartida por los tres niveles, HUD arriba, controles táctiles abajo. */
  :root {
    --bg: #14160f; --panel: #1f2317; --panel-2: #2a3020; --line: #3b4330;
    --fg: #e8e4cf; --muted: #9a9a84;
    --amber: #f2b134; --red: #d9534f; --cyan: #5bc0de; --green: #8fbf5a;
    --display: "Black Ops One", "Impact", "Arial Black", sans-serif;
    --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .top { width: 100%; max-width: 960px; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(22px, 4vw, 34px); margin: 0; letter-spacing: .02em; color: var(--amber); line-height: 1; text-wrap: balance; }
  h1 small { display: block; font-family: var(--body); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .hud { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; }
  .stat { background: var(--panel); border: 1px solid var(--line); padding: 6px 12px; min-width: 76px; }
  .stat b { display: block; font-family: var(--mono); font-size: 20px; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat span { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .mute, .menuBtn { background: var(--panel-2); border: 1px solid var(--line); color: var(--fg); font-family: var(--mono); font-size: 12px; padding: 6px 10px; cursor: pointer; }
  .mute:focus-visible, .menuBtn:focus-visible { outline: 2px solid var(--amber); }
  .stage { position: relative; width: 100%; max-width: 960px; aspect-ratio: 960 / 600; background: #22261a; border: 2px solid var(--line); box-sizing: border-box; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: rgba(20,22,15,.88); padding: 24px; box-sizing: border-box; gap: 14px; overflow: auto; }
  .overlay h2 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 5vw, 44px); margin: 0; color: var(--amber); line-height: 1; }
  .overlay h2 small { display: block; font-family: var(--body); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .overlay p { max-width: 56ch; margin: 0; line-height: 1.5; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; font-size: 13px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); padding: 4px 10px; background: var(--panel); }
  .chip i { width: 10px; height: 10px; display: inline-block; }
  .btn { font-family: var(--display); font-size: 20px; letter-spacing: .06em; background: var(--amber); color: #1a1500; border: 0; padding: 12px 28px; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); font-size: 15px; }
  .btn:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  .rank { font-family: var(--mono); font-size: 14px; color: var(--muted); line-height: 1.6; }
  .rank b { color: var(--green); }
  .levels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 760px; }
  .lv { text-align: left; background: var(--panel); border: 1px solid var(--line); padding: 12px; cursor: pointer; color: var(--fg); font-family: var(--body); min-width: 0; }
  .lv:hover, .lv:focus-visible { border-color: var(--amber); outline: none; }
  .lv[disabled] { opacity: .45; cursor: not-allowed; }
  .lv b { font-family: var(--display); font-weight: 400; display: block; font-size: 16px; color: var(--amber); }
  .lv small { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; line-height: 1.4; }
  .lv .best { font-family: var(--mono); font-size: 11px; color: var(--green); margin-top: 6px; display: block; }
  @media (max-width: 640px) { .levels { grid-template-columns: 1fr; } }
  .namerow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .namerow label { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .namerow input { background: var(--panel); border: 1px solid var(--line); color: var(--fg); font-family: var(--mono); font-size: 16px; padding: 10px 12px; width: 180px; max-width: 100%; }
  .namerow input:focus-visible { outline: 2px solid var(--amber); }
  .board { border-collapse: collapse; font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; width: 100%; max-width: 560px; }
  .board th { font-family: var(--body); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 4px 8px; border-bottom: 1px solid var(--line); text-align: right; }
  .board td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: right; }
  .board th:nth-child(2), .board td:nth-child(2) { text-align: left; }
  .board tr.me td { color: var(--amber); }
  #board { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; overflow-x: auto; }
  .btnrow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .touch { width: 100%; max-width: 960px; display: none; justify-content: space-between; align-items: center; user-select: none; -webkit-user-select: none; }
  @media (pointer: coarse) { .touch { display: flex; } }
  .dpad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 4px; }
  .dpad button, .act { background: var(--panel-2); border: 1px solid var(--line); color: var(--fg); font-family: var(--display); font-size: 18px; touch-action: none; }
  .dpad button:active, .act:active { background: var(--amber); color: #1a1500; }
  .dpad .u { grid-column: 2; grid-row: 1; } .dpad .l { grid-column: 1; grid-row: 2; } .dpad .r { grid-column: 3; grid-row: 2; } .dpad .d { grid-column: 2; grid-row: 3; }
  .acts { display: flex; gap: 10px; align-items: center; }
  .act { width: 110px; height: 110px; border-radius: 50%; font-size: 15px; letter-spacing: .06em; }
  .act.small { width: 72px; height: 72px; font-size: 12px; }
  .help { max-width: 960px; width: 100%; font-size: 13px; color: var(--muted); margin: 0; line-height: 1.5; }
  .help kbd { font-family: var(--mono); background: var(--panel); border: 1px solid var(--line); padding: 1px 6px; color: var(--fg); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="top">
  <h1><small id="hSub">Malvinas, 1982</small><span id="hTitle">Malvinas Arcade</span></h1>
  <div class="hud" id="hud"></div>
</div>

<div class="stage">
  <canvas id="c" width="960" height="600"></canvas>
  <div class="overlay" id="ov"></div>
</div>

<div class="touch">
  <div class="dpad">
    <button class="u" data-k="up" aria-label="Arriba">▲</button>
    <button class="l" data-k="left" aria-label="Izquierda">◀</button>
    <button class="r" data-k="right" aria-label="Derecha">▶</button>
    <button class="d" data-k="down" aria-label="Abajo">▼</button>
  </div>
  <div class="acts">
    <button class="act small" id="act2Btn" data-k="act2" hidden>BENGALA</button>
    <button class="act" id="actBtn" data-k="act">ACCIÓN</button>
  </div>
</div>

<p class="help" id="help">Elegí un nivel para empezar.</p>

<script>
(() => {
  const W = 960, H = 600;
  const cv = document.getElementById('c'), ctx = ctx0();
  function ctx0() { return cv.getContext('2d'); }
  const ov = document.getElementById('ov'), hud = document.getElementById('hud'), help = document.getElementById('help');
  const hTitle = document.getElementById('hTitle'), hSub = document.getElementById('hSub'), actBtn = document.getElementById('actBtn'), act2Btn = document.getElementById('act2Btn');
  const rand = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.floor(Math.random() * a.length)];
  const ease = t => 1 - Math.pow(1 - t, 3);
  function shade(hex, k) { const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255; const f = v => Math.max(0, Math.min(255, Math.round(v + (k > 0 ? (255 - v) * k : v * k)))); return `rgb(${f(r)},${f(g)},${f(b)})`; }
  const fmtT = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;

  /* ---------- entrada ---------- */
  const keys = { up: 0, down: 0, left: 0, right: 0, act: 0, act2: 0 };
  let actEdge = false, act2Edge = false;
  const KEYMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', KeyE: 'act', Space: 'act', KeyF: 'act2', ShiftLeft: 'act2', ShiftRight: 'act2' };
  const typing = () => { const t = document.activeElement; return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA'); };
  addEventListener('keydown', e => { if (typing()) return; const k = KEYMAP[e.code]; if (!k) return; e.preventDefault(); if (k === 'act' && !keys.act) actEdge = true; if (k === 'act2' && !keys.act2) act2Edge = true; keys[k] = 1; });
  addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = 0; });
  addEventListener('blur', () => { for (const k in keys) keys[k] = 0; });
  document.querySelectorAll('[data-k]').forEach(b => {
    const k = b.dataset.k;
    const on = e => { e.preventDefault(); if (k === 'act' && !keys.act) actEdge = true; if (k === 'act2' && !keys.act2) act2Edge = true; keys[k] = 1; };
    const off = e => { e.preventDefault(); keys[k] = 0; };
    b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
  });

  /* ---------- audio sintetizado (Web Audio) ---------- */
  const A = { ctx: null, on: true, tension: 0, loops: {} };
  function audioInit() {
    if (A.ctx) { if (A.ctx.state === 'suspended') A.ctx.resume(); return; }
    const c = A.ctx = new (window.AudioContext || window.webkitAudioContext)();
    A.master = c.createGain(); A.master.gain.value = A.on ? .8 : 0; A.master.connect(c.destination);
    A.sfx = c.createGain(); A.sfx.gain.value = .9; A.sfx.connect(A.master);
    A.mus = c.createGain(); A.mus.gain.value = .3; A.mus.connect(A.master);
    const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    A.noise = buf;
    musicStart();
  }
  // bucles continuos (motor, chorro de combustible): se crean una vez y se controlan por ganancia
  function loop(name, kind, freq, q) {
    if (A.loops[name]) return A.loops[name];
    const c = A.ctx, g = c.createGain(); g.gain.value = 0; g.connect(A.sfx);
    const f = c.createBiquadFilter(); f.type = kind === 'noise' ? 'bandpass' : 'lowpass'; f.frequency.value = freq; f.Q.value = q || .7; f.connect(g);
    let src;
    if (kind === 'noise') { src = c.createBufferSource(); src.buffer = A.noise; src.loop = true; }
    else { src = c.createOscillator(); src.type = kind; src.frequency.value = freq; }
    src.connect(f); src.start();
    return A.loops[name] = { g, f, src };
  }
  function setLoop(name, gain, freq, ffreq) { const l = A.loops[name]; if (!l) return; const t = A.ctx.currentTime; l.g.gain.setTargetAtTime(A.on ? gain : 0, t, .08); if (freq && l.src.frequency) l.src.frequency.setTargetAtTime(freq, t, .1); if (ffreq) l.f.frequency.setTargetAtTime(ffreq, t, .1); }
  function noiseHit(dur, freq, type, vol, when) {
    const c = A.ctx, t = when || c.currentTime, s = c.createBufferSource(); s.buffer = A.noise;
    const f = c.createBiquadFilter(); f.type = type || 'lowpass'; f.frequency.value = freq; const g = c.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    s.connect(f); f.connect(g); g.connect(A.sfx); s.start(t); s.stop(t + dur + .05);
  }
  function tone(f0, f1, dur, type, vol, when, dest) {
    const c = A.ctx, t = when || c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g); g.connect(dest || A.sfx); o.start(t); o.stop(t + dur + .05);
  }
  const SFX = {
    // compartidos
    explode(big) { noiseHit(big ? 1.4 : .7, big ? 220 : 400, 'lowpass', big ? 1 : .6); tone(90, 30, big ? .8 : .4, 'sine', big ? .8 : .5); },
    hit() { noiseHit(.5, 500, 'lowpass', .7); tone(200, 60, .35, 'square', .25); },
    die() { noiseHit(2, 150, 'lowpass', 1.2); tone(120, 25, 1.6, 'sawtooth', .5); },
    missile() { noiseHit(1.2, 1200, 'bandpass', .5); tone(220, 900, .9, 'sawtooth', .08); },
    lockLost() { tone(880, 440, .25, 'square', .08); },
    rwr() { tone(1600, 1600, .07, 'square', .07); },
    warn() { tone(520, 520, .06, 'square', .09); tone(520, 520, .06, 'square', .09, A.ctx.currentTime + .1); },
    chime() { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, .25, 'triangle', .14, A.ctx.currentTime + i * .09)); },
    buzz() { tone(180, 140, .5, 'sawtooth', .22); },
    // hangar
    step() { noiseHit(.07, 300, 'lowpass', .18); },
    pickup() { tone(700, 1000, .08, 'square', .08); },
    clank() { tone(2600, 1800, .06, 'square', .09); noiseHit(.08, 3000, 'highpass', .2); },
    creak() { tone(150, 125, .3, 'sawtooth', .07); },
    done() { tone(660, 990, .18, 'triangle', .14); },
    takeoff() { const t = A.ctx.currentTime, s = A.ctx.createBufferSource(); s.buffer = A.noise; const f = A.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(200, t); f.frequency.exponentialRampToValueAtTime(2200, t + 2.2); const g = A.ctx.createGain(); g.gain.setValueAtTime(.001, t); g.gain.exponentialRampToValueAtTime(.7, t + 1.2); g.gain.exponentialRampToValueAtTime(.001, t + 3); s.connect(f); f.connect(g); g.connect(A.sfx); s.start(t); s.stop(t + 3.1); tone(70, 320, 2.4, 'sawtooth', .12, t); },
    tick() { tone(1000, 1000, .05, 'square', .06); },
    // estrecho
    drop() { tone(1400, 300, 1.1, 'sine', .12); },
    splash() { noiseHit(.5, 1800, 'bandpass', .35); },
    flak() { noiseHit(.35, 900, 'lowpass', .55); tone(160, 50, .2, 'triangle', .3); },
    dud() { tone(300, 120, .25, 'triangle', .25); noiseHit(.3, 2500, 'highpass', .2); },
    // aire-aire
    gun() { noiseHit(.07, 1400, 'bandpass', .5); tone(140, 90, .06, 'square', .18); },
    egun() { noiseHit(.08, 700, 'bandpass', .3); },
    flare() { noiseHit(.3, 4000, 'highpass', .4); tone(1800, 2600, .2, 'sine', .1); },
    kill() { noiseHit(1, 300, 'lowpass', .9); tone(160, 40, .7, 'sawtooth', .35); noiseHit(.6, 2500, 'highpass', .25); },
  };
  function sfx(name, arg) { if (A.ctx && A.on) SFX[name](arg); }
  // música: patrón por nivel, el arpegio se intensifica con A.tension
  const M = { step: 0, next: 0, cfg: null };
  function musicStart() { M.next = A.ctx.currentTime + .1; M.step = 0; setInterval(() => { if (!M.cfg) return; while (M.next < A.ctx.currentTime + .12) { musicStep(M.step, M.next); M.step = (M.step + 1) % 64; M.next += 60 / M.cfg.bpm / 4; } }, 25); }
  function musicSet(cfg) { M.cfg = cfg; M.step = 0; if (A.ctx) M.next = A.ctx.currentTime + .05; }
  function musicStep(s, t) {
    const c = A.ctx, cfg = M.cfg, bar = Math.floor(s / 16), i = s % 16;
    const kick = f => { const o = c.createOscillator(), g = c.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + .14); g.gain.setValueAtTime(.9 * f, t); g.gain.exponentialRampToValueAtTime(.001, t + .22); o.connect(g); g.connect(A.mus); o.start(t); o.stop(t + .25); };
    const nz = (v, hp, dur) => { const sN = c.createBufferSource(); sN.buffer = A.noise; const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp; const g = c.createGain(); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + dur); sN.connect(f); f.connect(g); g.connect(A.mus); sN.start(t); sN.stop(t + dur + .02); };
    const snare = v => { nz(v, 1500, .16); tone(190, 120, .1, 'triangle', v * .5, t, A.mus); };
    const hat = v => nz(v, 7000, .05);
    if (cfg.drums === 'light') { if (i === 0 || i === 8) kick(.7); if (i === 4 || i === 12) snare(.25); if (i % 4 === 2) hat(.07); }
    else if (cfg.drums === 'march') { if (i === 0 || i === 8 || i === 10) kick(1); if (i === 14) kick(.6); if (i === 4 || i === 12) snare(.45); if (i === 15 && bar % 2) snare(.25); if (i % 2 === 0) hat(i % 4 === 0 ? .12 : .06); }
    else { if (i % 4 === 0 || i === 7 || i === 10) kick(1); if (i === 4 || i === 12) snare(.5); if (i === 14 || (i === 15 && bar % 2)) snare(.3); hat(i % 2 ? .05 : .11); }
    if (i % 2 === 0) { const r = cfg.roots[bar] * (i === 6 || i === 14 ? 1.5 : 1); tone(r, r, .2, 'sawtooth', cfg.bass, t, A.mus); }
    const lead = cfg.lead + A.tension * .14;
    if (A.tension > .05 || i % 4 === 0) { const n = cfg.arp[bar][(i / 2 | 0) % 4] * (A.tension > .5 ? 2 : 1); tone(n, n, .18, A.tension > .5 ? 'square' : 'triangle', lead, t, A.mus); }
  }
  const MUSIC = {
    hangar: { bpm: 118, drums: 'light', bass: .16, lead: .06, roots: [73.42, 87.31, 98, 110], arp: [[293.66, 369.99, 440, 587.33], [349.23, 440, 523.25, 698.46], [392, 493.88, 587.33, 783.99], [440, 523.25, 659.25, 880]] },
    estrecho: { bpm: 132, drums: 'march', bass: .22, lead: .06, roots: [73.42, 73.42, 87.31, 65.41], arp: [[293.66, 349.23, 440, 587.33], [293.66, 349.23, 440, 523.25], [349.23, 440, 523.25, 698.46], [261.63, 329.63, 392, 523.25]] },
    aire: { bpm: 150, drums: 'hard', bass: .24, lead: .08, roots: [82.41, 82.41, 98, 65.41], arp: [[329.63, 392, 493.88, 659.25], [329.63, 392, 493.88, 587.33], [392, 493.88, 587.33, 783.99], [261.63, 329.63, 392, 523.25]] },
  };

  /* ---------- flujo: inicio con nombre, campaña lineal, tabla de posiciones ---------- */
  const STORE = 'malvinas-arcade-v2';
  let local = { name: '', scores: [] };
  try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && s.scores) local = s; } catch (e) {}
  function saveLocal() { try { localStorage.setItem(STORE, JSON.stringify(local)); } catch (e) {} }
  let current = null, run = { name: '', scores: [0, 0, 0] };
  let DB = null, dbTried = false;
  async function getDb() { if (dbTried) return DB; dbTried = true; try { DB = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { DB = null; } return DB; }
  const slug = n => n.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'jugador';
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function recordScore(name, scores, finished) {
    const total = scores.reduce((a, b) => a + b, 0), entry = { name, total, levels: scores.slice(), finished, at: new Date().toISOString() };
    const i = local.scores.findIndex(e => slug(e.name) === slug(name));
    if (i < 0) local.scores.push(entry); else if (total > local.scores[i].total) local.scores[i] = entry;
    local.scores.sort((a, b) => b.total - a.total); local.scores = local.scores.slice(0, 50); saveLocal();
    getDb().then(async db => { if (!db) return; const ref = db.doc('scores/' + slug(name)); try { const cur = await ref.get(); if (!cur.exists || (cur.data().total || 0) < total) await ref.set(entry); } catch (e) {} });
  }
  async function loadBoard() {
    const db = await getDb();

      if (m.lock) { ctx.strokeStyle = 'rgba(217,83,79,.7)'; ctx.lineWidth = 1; ctx.setLineDash([3, 5]); ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(G.player.x, G.player.y); ctx.stroke(); ctx.setLineDash([]); }
    }
    function draw() {
      drawBackground();
      for (const e of G.enemies) drawHarrier(e);
      for (const b of G.pb) { ctx.fillStyle = '#ffe08a'; ctx.fillRect(b.x - 8, b.y - 1, 12, 2); }
      for (const b of G.eb) { if (b.delay > 0) continue; ctx.fillStyle = '#ff8a7a'; ctx.fillRect(b.x - 4, b.y - 1, 12, 2); }
      for (const m of G.missiles) drawMissile(m);
      const P = G.player; if (P.alive) drawMirage(P);
      for (const p of G.parts) { ctx.globalAlpha = Math.min(1, p.life); ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); } ctx.globalAlpha = 1;
      if (P.alive) {
        ctx.fillStyle = 'rgba(20,22,15,.6)'; ctx.fillRect(P.x - 22, P.y - 44, 44, 7); for (let i = 0; i < HP; i++) { ctx.fillStyle = i < P.hp ? (P.hp === 1 ? '#d9534f' : '#8fbf5a') : '#3b4330'; ctx.fillRect(P.x - 20 + i * 14, P.y - 42, 12, 3); }
        const locked = G.missiles.some(m => m.lock); if (locked && Math.floor(G.time * 8) % 2) { ctx.fillStyle = '#ff5a52'; ctx.font = '400 16px "Black Ops One", Impact, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('¡MISIL! BENGALAS', P.x, P.y - 54); }
        // indicadores de enemigos fuera de pantalla
        for (const e of G.enemies) if (e.x < -20 || e.x > W + 20) { ctx.fillStyle = '#ff5a52'; const ax = e.x < 0 ? 14 : W - 14; ctx.beginPath(); ctx.moveTo(ax, e.y); ctx.lineTo(ax + (e.x < 0 ? 10 : -10), e.y - 6); ctx.lineTo(ax + (e.x < 0 ? 10 : -10), e.y + 6); ctx.closePath(); ctx.fill(); }
      }
      for (const m of G.msgs) { ctx.globalAlpha = Math.min(1, m.life); ctx.fillStyle = m.color; ctx.font = `400 ${m.max > 2 ? 22 : 15}px "Black Ops One", Impact, sans-serif`; ctx.textAlign = 'center'; ctx.fillText(m.text, m.x, m.y); ctx.globalAlpha = 1; }
    }
    function hudUpdate() { setStat('kills', `${G.kills}/${GOAL}`); setStat('ammo', G.player.ammo); setStat('flares', G.player.flares); setStat('lives', G.lives); setStat('hp', `${Math.max(0, G.player.hp)}/${HP}`); setStat('score', G.score); }
    return {
      title: 'Cielo de Malvinas', sub: 'Patrulla aérea · junio de 1982', blurb: 'Combate aire-aire: tu Mirage III contra los Sea Harrier, con cañones de 30 mm y bengalas.',
      intro: `Pilotás un Mirage IIIEA de la VIII Brigada en patrulla sobre las islas. Los Sea Harrier entran de frente tirando con sus cañones y, cuando pasan por atrás, te lanzan <b>Sidewinder</b>. Tus armas: dos cañones DEFA de 30 mm (mantené acción para disparar) y <b>bengalas</b> que engañan a todos los misiles enganchados. Objetivo: ${GOAL} derribos.`,
      legend: '<span class="chip"><i style="background:var(--amber)"></i>Cañones · 300 proyectiles</span><span class="chip"><i style="background:var(--cyan)"></i>Bengalas · 3 por avión</span><span class="chip"><i style="background:var(--red)"></i>Sidewinder: corta el enganche con bengalas</span>',
      button: 'Al combate', action: 'FUEGO', action2: 'BENGALA', music: MUSIC.aire,
      help: 'Subir y bajar: <kbd>W</kbd>/<kbd>S</kbd> o flechas · Acelerar y frenar: <kbd>A</kbd>/<kbd>D</kbd> · Cañones: <kbd>Espacio</kbd> (mantener) · Bengalas: <kbd>F</kbd> o <kbd>Shift</kbd>. Cada derribo devuelve munición; cada oleada limpia rearma todo.',
      failText: 'Se perdieron los tres Mirage antes de completar los derribos.', stats: [{ id: 'kills', label: 'Derribos' }, { id: 'ammo', label: 'Munición' }, { id: 'flares', label: 'Bengalas' }, { id: 'lives', label: 'Aviones' }, { id: 'hp', label: 'Estructura' }, { id: 'score', label: 'Puntos' }],
      init, begin, update, draw, hud: hudUpdate,
    };
  })();

  const LEVELS = [hangar, estrecho, aire];

  /* ---------- bucle principal ---------- */
  let last = 0;
  function frame(ts) {
    const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts;
    if (current) { current.update(dt); if (current) { current.draw(); current.hud(); } }
    else { // fondo del menú: hangar en reposo
      hangar.update(dt); hangar.draw();
    }
    actEdge = false; act2Edge = false;
    requestAnimationFrame(frame);
  }
  function fit() { const r = cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0); }
  addEventListener('resize', fit); fit();
  hangar.init(); showStart(); requestAnimationFrame(frame);
})();
</script>
